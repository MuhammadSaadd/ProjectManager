$schema: "https://moonrepo.dev/schemas/project.json"

language: csharp
stack: backend
layer: application

dependsOn:
  - backend

tasks:
  generate-spec:
    command: "../../scripts/generate-spec.sh"
    deps:
      - backend:build
    inputs:
      - "src/**/*"
      - "*.csproj"
    outputs:
      - "/schemas/api.json"
